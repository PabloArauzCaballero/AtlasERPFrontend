# Configuración de gitleaks (auditoría a producción, 2026-09-13).
#
# Reglas por defecto y NINGUNA excepción por archivo. Un fixture de prueba verificado se marca en
# su propia línea con `// gitleaks:allow`: no deja el valor en esta configuración, sobrevive a que
# la línea se mueva y no exime al resto del archivo. Una excepción por ruta sí lo haría: medido con
# gitleaks 8.30, `[[allowlists]]` con `paths` + `regexes` y `condition = "AND"` se salta el archivo
# ENTERO, así que un token nuevo con otro nombre en ese mismo archivo pasaba sin avisar.
#
# Local: gitleaks dir . --config .gitleaks.toml --redact   (el .env local no llega a la CI)

title = "Atlas gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Artefactos y plantillas que no son código de Atlas"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)(dist|coverage|\.next)/''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''\.env\.example$''',
  '''(^|/)graphify-out/''',
]

# Contraseñas y correos de cuentas REALES escritos a mano en el código (2026-09-19).
#
# Por qué hace falta una regla propia: las reglas por defecto reconocen tokens de proveedores por
# su forma (prefijos, longitudes, entropía). Una contraseña humana no tiene ninguna de esas señas,
# así que `password: '...'` en un `.spec.ts` pasaba limpio. Y pasó: dos baterías del portal
# llevaban el correo y la contraseña de comercios reales commiteados en un repositorio PÚBLICO,
# mientras una tercera —`portal-comercio-soporte`— ya las leía de variables de entorno con un
# comentario explicando justo este riesgo. La convención existía; el gate no la sostenía.
#
# Lo que se exige: las credenciales se leen de `process.env`. Un valor de ejemplo se marca en su
# línea con `gitleaks:allow`, como el resto de este archivo.
[[rules]]
id = "atlas-credencial-en-codigo"
description = "Contraseña escrita a mano en el código (usa process.env)"
regex = '''(?i)\b(password|passwd|contrasena|contraseña|secret)\s*[:=]\s*['"][^'"\s$][^'"]{5,}['"]'''
path = '''\.(ts|tsx|js|jsx|mjs|cjs|json|ya?ml)$'''
[rules.allowlist]
description = "Referencias a variables, no valores"
regexes = [
  '''process\.env\.''',
  '''\$\{''',
  '''<[^>]+>''',
]

# Portal del ERP, gestionado por COOLIFY.
#
# Va aparte de `docker-compose.dev.yml` —el del VPS operado a mano, con los `.env` en
# `/opt/atlas/env` y la red compartida `atlas_vps`—.
#
# ## `ERP_API_ORIGIN` se hornea AL CONSTRUIR
#
# Es un `build.arg`, así que su valor queda dentro del bundle: cambiarlo en Environment Variables
# y reiniciar **no hace nada**, hay que RECONSTRUIR.
#
# Vale `http://erp:3007`: `erp` es el ALIAS estable del backend del ERP en la red compartida
# `coolify` (ver `networks` al final). Sólo resuelve si esta aplicación tiene activado «Connect To
# Predefined Network»; si no, el fallo —`EAI_AGAIN erp`— se lee igual que «el ERP está caído».
#
# ## Lo que este archivo NO trae
#
# La red externa `atlas_vps` ni `env_file`: Coolify añade `env_file: - .env` a cada servicio por
# su cuenta. Pega ahí `atlas-vps-testing/env/erp-frontend.env`, EN BLOQUE.

name: atlas-erp-frontend

services:
  frontend:
    environment:
      APP_COMMIT_SHA: '${SOURCE_COMMIT:-}'
      APP_VERSION: '0.1.0'
      # Destinos EXACTOS (`host` o `host:puerto`) a los que `/almacen/subida` reenvía las subidas
      # firmadas (app/almacen/subida/route.ts). Sin ella la ruta responde 503. Por defecto, el almacén
      # público de TEST (Contabo, `STORAGE_S3_PUBLIC_ENDPOINT` de AtlasBackend) y el de DEV (H310 por
      # Tailscale), porque este mismo compose sirve los dos. Un entorno con otro almacén la define en
      # Coolify: el valor de allí sustituye a éste entero.
      ALMACEN_HOSTS_PERMITIDOS: '${ALMACEN_HOSTS_PERMITIDOS:-minio.161.97.85.216.sslip.io,pablo-h310.taila8f993.ts.net}'
    # `erp-web`: alias ESTABLE por el que Traefik sondea y sirve este portal en TEST, con failover a
    # la instancia de respaldo (_herramientas/respaldo-erp/atlas-erp-failover.yaml). El nombre del
    # contenedor cambia en cada despliegue; el alias no. Sin él, la sonda falla y sirve el respaldo.
    networks:
      default: {}
      coolify:
        aliases: ['erp-web']
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    image: atlas-erp-frontend:coolify
    build:
      context: .
      dockerfile: Dockerfile.dev
      # La caché de build la guarda el DEMONIO, y Coolify la borra cada noche.
      #
      # Aquí había un `cache_from: ['<imagen>:coolify']` que fallaba SIEMPRE —`pull access denied`, en
      # esta máquina no hay registro—. Quitarlo no devuelve caché: sólo deja de fallar y de ensuciar el
      # log. Se retira porque era ruido, no porque estuviera dando algo.
      #
      # Y no se sustituye por `cache_to: type=local`, aunque el driver lo soporte: **el exportador local
      # es del lado del CLIENTE**, y Coolify construye dentro de un contenedor efímero (`docker run
      # --rm`, que sólo monta el socket). Medido: la caché aterriza DENTRO de ese contenedor y se va con
      # él. Sería trabajo por nada.
      #
      # La caché que de verdad se usa es la del propio buildkit del demonio, automática y sin declarar
      # nada. Lo que la tira es `docker builder prune -af` que Coolify ejecuta A DIARIO cuando el
      # servidor tiene `force_docker_cleanup` activo — con esa bandera no mira el umbral de disco, borra
      # igual. Medido el 2026-09-07: los builds de después de la limpieza tardaban 19-27 min y uno murió
      # con `ESOCKETTIMEDOUT` bajando una dependencia; los del mismo día con la caché ya caliente,
      # 1-5 min.
      #
      # Es decir: esto se arregla en el SERVIDOR (Settings -> Docker Cleanup -> desactivar el forzado,
      # dejando el umbral del 80%), no en este archivo.
      args:
        # PLAT-03: el commit compilado. Sin este build-arg `/version` sale con commit `unknown` y el smoke de
        # TEST lo rechaza. Coolify rellena SOURCE_COMMIT al construir; si no, se lee `.git/HEAD`.
        SOURCE_COMMIT: '${SOURCE_COMMIT:-}'
        # El backend del ERP, por su alias en la red `coolify`. Ver la nota de arriba.
        ERP_API_ORIGIN: 'http://erp:3007'
    # `init: true` reparte SIGTERM al proceso de Node, sin depender de instalar un binario.
    init: true
    # SIN `ports:` — y es lo que evita el fallo que rompía cada redespliegue.
    #
    # Coolify nombra cada contenedor con una MARCA DE TIEMPO, así que en cada despliegue crea uno
    # NUEVO en vez de reemplazar el anterior. Mientras el viejo siga en pie sujeta el puerto del
    # host, y el nuevo muere con `failed to bind host port ...: address already in use`. No es un
    # puerto mal elegido: publicar un puerto FIJO desde el compose es incompatible con cómo
    # despliega Coolify.
    #
    # Quien publica este portal del ERP es el PROXY de Coolify. En la aplicación, pon en el campo de
    # dominio:  http://100.101.207.88:3010
    # Coolify configura entonces su proxy para escuchar ahí y enrutar al contenedor, y se encarga
    # él de retirar el anterior — que es justo lo que un compose con puerto fijo no puede hacer.
    expose: ['3010']
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

# ---------------------------------------------------------------------------------------------
# La red COMPARTIDA de Coolify.
#
# Es como este portal alcanza a los backends: por su ALIAS estable (`atlas-backend`, `motor`,
# `erp`), no por una IP del host. Coolify nombra cada contenedor con una marca de tiempo, así que
# los nombres cambian en cada despliegue pero los alias no.
#
# **Hace falta activar «Connect To Predefined Network» en esta aplicación dentro de Coolify.**
networks:
  default: {}
  coolify:
    external: true
    name: coolify

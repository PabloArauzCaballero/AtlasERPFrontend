# Portal del ERP, gestionado por COOLIFY.
#
# Va aparte de `docker-compose.dev.yml` —el del VPS operado a mano, con los `.env` en
# `/opt/atlas/env` y la red compartida `atlas_vps`—.
#
# ## `ERP_API_ORIGIN` se hornea AL CONSTRUIR
#
# Es un `build.arg`, así que su valor queda dentro del bundle: cambiarlo en Environment Variables
# y reiniciar **no hace nada**, hay que RECONSTRUIR.
#
# Y NO puede seguir siendo `http://erp:3007`. Ese era un alias de la red compartida `atlas_vps`
# del VPS operado a mano; en Coolify cada aplicación tiene su propia red, así que el nombre no
# resuelve y el fallo —`EAI_AGAIN erp`— se lee igual que «el ERP está caído». Va la IP de
# Tailscale del host, que es una dirección real y alcanzable desde otro contenedor.
#
# ## Lo que este archivo NO trae
#
# La red externa `atlas_vps` ni `env_file`: Coolify añade `env_file: - .env` a cada servicio por
# su cuenta. Pega ahí `atlas-vps-testing/env/erp-frontend.env`, EN BLOQUE.

name: atlas-erp-frontend

services:
  frontend:
    networks: ['default', 'coolify']
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    image: atlas-erp-frontend:coolify
    build:
      context: .
      dockerfile: Dockerfile.dev
      cache_from: ['atlas-erp-frontend:coolify']
      args:
        # El backend del ERP, por la IP de Tailscale. Ver la nota de arriba.
        ERP_API_ORIGIN: 'http://erp:3007'
    # `init: true` reparte SIGTERM al proceso de Node, sin depender de instalar un binario.
    init: true
    # SIN `ports:` — y es lo que evita el fallo que rompía cada redespliegue.
    #
    # Coolify nombra cada contenedor con una MARCA DE TIEMPO, así que en cada despliegue crea uno
    # NUEVO en vez de reemplazar el anterior. Mientras el viejo siga en pie sujeta el puerto del
    # host, y el nuevo muere con `failed to bind host port ...: address already in use`. No es un
    # puerto mal elegido: publicar un puerto FIJO desde el compose es incompatible con cómo
    # despliega Coolify.
    #
    # Quien publica este portal del ERP es el PROXY de Coolify. En la aplicación, pon en el campo de
    # dominio:  http://100.101.207.88:3010
    # Coolify configura entonces su proxy para escuchar ahí y enrutar al contenedor, y se encarga
    # él de retirar el anterior — que es justo lo que un compose con puerto fijo no puede hacer.
    expose: ['3010']
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

# ---------------------------------------------------------------------------------------------
# La red COMPARTIDA de Coolify.
#
# Es como este portal alcanza a los backends: por su ALIAS estable (`atlas-backend`, `motor`,
# `erp`), no por una IP del host. Coolify nombra cada contenedor con una marca de tiempo, así que
# los nombres cambian en cada despliegue pero los alias no.
#
# **Hace falta activar «Connect To Predefined Network» en esta aplicación dentro de Coolify.**
networks:
  default: {}
  coolify:
    external: true
    name: coolify
